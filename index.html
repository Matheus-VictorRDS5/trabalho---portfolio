<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfólio · Fitas VHS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="loader"><canvas id="gl"></canvas><div id="pct">0%</div></div>
<main id="shelf" class="view" hidden>
  <p class="hint">&larr; arraste, role ou use as setas &rarr; &middot; clique na fita do meio para abrir</p>
  <div class="stage" id="tapes">
    <div class="vcr" aria-hidden="true"><i></i><i></i></div>
    <button class="nav prev" aria-label="Fita anterior">&lt;</button>
    <button class="nav next" aria-label="Próxima fita">&gt;</button>
  </div>
  <p class="selname" id="selname" aria-live="polite"></p>
</main>
<main id="tape" class="view" hidden>
  <header class="hud"><span id="uptime">00:00:00</span><span id="clock">--:--</span></header>
  <div class="scroller" id="scenes"></div>
</main>
<div class="crt"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
